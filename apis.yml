aid: todyl
name: Todyl
description: >-
  Todyl is a Denver, Colorado cybersecurity company that sells a single-agent, cloud-native security
  platform to managed service providers, solution providers and internal IT teams. The Todyl Security
  Platform consolidates modules that are usually bought separately — SASE (Secure Access Service Edge,
  delivered over Todyl's Secure Global Network), Endpoint Security (EDR/NGAV), a cloud-native SIEM,
  MXDR (24x7 managed extended detection and response with a human SOC), GRC (governance, risk and
  compliance), and Security Automation playbooks — behind one agent and one multi-tenant portal.
  Todyl operates a live production REST API at https://api.todyl.com (path-versioned at /v1) that
  partners use to enumerate devices, deployment groups and billing data across their tenants, and it
  integrates with PSA/RMM tooling such as Autotask and ConnectWise. Access is authenticated with an
  External API token pair issued inside the Todyl portal; the API reference itself is published only
  in the customer-authenticated knowledge base, so no public OpenAPI, reference page or developer
  portal exists at the time of this profile.
