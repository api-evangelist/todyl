apis:
- name: Todyl External API
  description: >-
    Todyl's External API is a path-versioned REST API served from https://api.todyl.com. Probing it
    unauthenticated returns Todyl's own JSON error envelope
    ({"error":{"code":"auth_missing_token","message":"Credentials missing or invalid.","request_id":"req_..."}}),
    and supplying the X-Todyl-Client-Id / X-Todyl-Access-Token header pair changes the code to
    auth_malformed_token, confirming those are the credential headers the service recognises. Tokens
    are minted in the Todyl portal under Account -> Developer APIs -> External API Tokens. Every path
    probed — including /openapi.json, /v1/openapi.json and /.well-known/* — answers 401, so no
    machine-readable contract is reachable without credentials.
  humanURL: https://www.todyl.com/support
  baseURL: https://api.todyl.com
