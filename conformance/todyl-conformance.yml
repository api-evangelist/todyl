domain_standard:
  declared: false
  note: >-
    Checked and absent. Todyl's market (MSP security operations) has candidate domain standards —
    OCSF, STIX/TAXII, Sigma, MITRE ATT&CK, OpenC2 — but domain_standard_conformance reads the
