  Todyl publishes no first-party client library on any registry. npm returns zero packages for
  "todyl"; PyPI has no "todyl" project. Todyl's public GitHub organisation (todylcom) holds six
  repositories and none of them is an SDK: three are unmodified forks of Go archive libraries
  (archiver, sevenzip, rardecode, last pushed 2023), one is TheDevice (C, the Todyl device firmware
  project), and two are SIEM log-ingestion templates — aws_integrations (a single Lambda function,
  directory_service_cloudwatch_sqs_s3.py) and microsoft_integrations (entra_identity_setup.ps1 and
  o365_siem_ingestion.ps1). Those two are genuine first-party integration helpers but they are setup
  scripts for shipping logs INTO Todyl's SIEM, not clients for the External API, and neither is
  distributed through a package registry. No SDKs pointer is emitted.
